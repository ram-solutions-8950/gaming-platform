
name: Deploy Gaming Platform

on:
  push:
    branches:
      - client-version

jobs:
  # ============================================
  # 1. CODE QUALITY CHECKS
  # ============================================

  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install ruff

      - name: Check backend
        run: ruff check --select F821,F822 backend/app backend/tests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc -b

  # ============================================
  # 2. BACKEND TESTS
  # ============================================

  backend-tests:
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gaming_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gaming_test_db
      AUTO_MIGRATE: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/integration tests/unit -q

  # ============================================
  # 3. PRODUCTION DEPLOYMENT
  # ============================================

  deploy:
    name: Deploy Polandexim
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 60s
          command_timeout: 30m

          script: |
            set -eu

            echo "===================================="
            echo "1. NAVIGATING TO PROJECT"
            echo "===================================="

            if [ -d /root/gaming-platform ]; then
              cd /root/gaming-platform
            elif [ -d "$HOME/gaming-platform" ]; then
              cd "$HOME/gaming-platform"
            else
              echo "ERROR: Project directory missing"
              exit 1
            fi

            echo "===================================="
            echo "2. PULLING LATEST CODE"
            echo "===================================="

            git fetch origin client-version
            git reset --hard origin/client-version
            git log -1 --oneline

            echo "===================================="
            echo "3. VALIDATING REQUIRED FILES"
            echo "===================================="

            test -f polandexim.conf || {
              echo "ERROR: polandexim.conf missing"
              exit 1
            }

            test -f docker-compose.yml || \
            test -f docker-compose.yaml || \
            test -f compose.yml || \
            test -f compose.yaml || {
              echo "ERROR: Docker Compose file missing"
              exit 1
            }

            echo "===================================="
            echo "4. STARTING DOCKER SERVICES"
            echo "===================================="

            docker compose up -d --build backend db redis payment

            echo "===================================="
            echo "5. BUILDING FRONTEND"
            echo "===================================="

            docker compose run --rm frontend npm run build

            test -f frontend/dist/index.html || {
              echo "ERROR: Frontend build missing"
              exit 1
            }

            echo "===================================="
            echo "6. DEPLOYING FRONTEND"
            echo "===================================="

            sudo mkdir -p \
              /opt/gaming-platform/frontend/dist

            sudo cp -a frontend/dist/. \
              /opt/gaming-platform/frontend/dist/

            echo "===================================="
            echo "7. DEPLOYING APK"
            echo "===================================="

            if [ -f frontend/public/Corona888.apk ]; then

              sudo cp frontend/public/Corona888.apk \
                /opt/gaming-platform/frontend/dist/Corona888.apk

              sudo chmod 644 \
                /opt/gaming-platform/frontend/dist/Corona888.apk

              echo "APK deployed"

            elif [ -f frontend/dist/Corona888.apk ]; then

              echo "APK already included in frontend build"

            else

              echo "ERROR: Corona888.apk missing"
              exit 1

            fi

            echo "===================================="
            echo "8. SETTING PERMISSIONS"
            echo "===================================="

            sudo chown -R www-data:www-data \
              /opt/gaming-platform/frontend/dist

            sudo find \
              /opt/gaming-platform/frontend/dist \
              -type d -exec chmod 755 {} +

            sudo find \
              /opt/gaming-platform/frontend/dist \
              -type f -exec chmod 644 {} +

            echo "===================================="
            echo "9. BACKING UP NGINX CONFIG"
            echo "===================================="

            sudo mkdir -p \
              /etc/nginx/deployment-backups

            if [ -f \
              /etc/nginx/sites-available/polandexim.conf ]; then

              sudo cp \
                /etc/nginx/sites-available/polandexim.conf \
                /etc/nginx/deployment-backups/polandexim.conf.bak

            fi

            echo "===================================="
            echo "10. INSTALLING NEW NGINX CONFIG"
            echo "===================================="

            sudo cp polandexim.conf \
              /etc/nginx/sites-available/polandexim.conf

            sudo ln -sfn \
              /etc/nginx/sites-available/polandexim.conf \
              /etc/nginx/sites-enabled/polandexim.conf

            echo "===================================="
            echo "11. DISABLING OLD SITES"
            echo "===================================="

            sudo rm -f /etc/nginx/sites-enabled/corona888.conf
            sudo rm -f /etc/nginx/sites-enabled/gaming-platform
            sudo rm -f /etc/nginx/sites-enabled/gaming-platform.backup

            # If Let's Encrypt certificate exists for polandexim.com, use it
            if [ -f /etc/letsencrypt/live/polandexim.com/fullchain.pem ] && [ -f /etc/letsencrypt/live/polandexim.com/privkey.pem ]; then
              echo "Using polandexim.com Let's Encrypt certificate"
              sudo sed -i 's|/etc/nginx/ssl/corona888.tech.pem|/etc/letsencrypt/live/polandexim.com/fullchain.pem|g' /etc/nginx/sites-available/polandexim.conf
              sudo sed -i 's|/etc/nginx/ssl/corona888.tech.key|/etc/letsencrypt/live/polandexim.com/privkey.pem|g' /etc/nginx/sites-available/polandexim.conf
            fi

            echo "===================================="
            echo "12. CHECKING ACTIVE NGINX RULES"
            echo "===================================="

            echo "Active site configurations:"

            sudo ls -la /etc/nginx/sites-enabled/

            echo "===================================="
            echo "13. TESTING NGINX"
            echo "===================================="

            if ! sudo nginx -t; then
              echo "ERROR: Nginx validation failed"

              if [ -f \
                /etc/nginx/deployment-backups/polandexim.conf.bak ]; then

                sudo cp \
                  /etc/nginx/deployment-backups/polandexim.conf.bak \
                  /etc/nginx/sites-available/polandexim.conf

              fi

              exit 1
            fi

            echo "===================================="
            echo "14. RELOADING NGINX"
            echo "===================================="

            sudo systemctl reload nginx
            sleep 2

            echo "===================================="
            echo "15. BACKEND HEALTH CHECK"
            echo "===================================="

            HEALTHY=0

            for i in $(seq 1 15); do

              if curl -fsS \
                http://127.0.0.1:8000/api/v1/health; then

                HEALTHY=1
                break

              fi

              sleep 2
            done

            if [ "$HEALTHY" -ne 1 ]; then

              docker compose logs --tail=100 backend
              exit 1

            fi

            echo "===================================="
            echo "16. TESTING MAIN WEBSITE"
            echo "===================================="

            echo "Waiting for payment service on port 3005..."
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:3005/ > /dev/null 2>&1; then
                echo "Payment service is online!"
                break
              fi
              sleep 2
            done

            ROOT_STATUS_HTTP=0
            ROOT_STATUS_HTTPS=0

            for i in $(seq 1 5); do
              ROOT_STATUS_HTTP=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: polandexim.com' http://127.0.0.1/ || true)
              ROOT_STATUS_HTTPS=$(curl -k -s -o /dev/null -w '%{http_code}' -H 'Host: polandexim.com' https://127.0.0.1/ || true)
              if [ "$ROOT_STATUS_HTTP" = "200" ] && [ "$ROOT_STATUS_HTTPS" = "200" ]; then
                break
              fi
              sleep 1
            done

            echo "Root status HTTP: $ROOT_STATUS_HTTP, HTTPS: $ROOT_STATUS_HTTPS"

            if [ "$ROOT_STATUS_HTTP" != "200" ] || [ "$ROOT_STATUS_HTTPS" != "200" ]; then
              echo "ERROR: Main website did not return 200 on HTTP or HTTPS"
              exit 1
            fi

            HTTPS_CONTENT=$(curl -k -s -H 'Host: polandexim.com' https://127.0.0.1/ || true)
            if echo "$HTTPS_CONTENT" | grep -q "AquaSan"; then
              echo "AquaSan Payment Portal verified on HTTPS"
            else
              echo "WARNING: AquaSan payment store marker not found in HTTPS content"
            fi

            echo "===================================="
            echo "17. TESTING APK DOWNLOAD"
            echo "===================================="

            DOWNLOAD_STATUS=0
            for i in $(seq 1 5); do
              DOWNLOAD_STATUS=$(curl -k -s -o /dev/null -w '%{http_code}' -H 'Host: polandexim.com' https://127.0.0.1/download || true)
              if [ "$DOWNLOAD_STATUS" = "200" ]; then
                break
              fi
              sleep 1
            done

            echo "Download status: $DOWNLOAD_STATUS"

            if [ "$DOWNLOAD_STATUS" != "200" ]; then
              echo "ERROR: APK download failed"
              exit 1
            fi

            echo "===================================="
            echo "18. TESTING ADMIN"
            echo "===================================="

            ADMIN_STATUS=0
            for i in $(seq 1 5); do
              ADMIN_STATUS=$(curl -k -s -o /dev/null -w '%{http_code}' -H 'Host: admin.polandexim.com' https://127.0.0.1/ || true)
              if [ "$ADMIN_STATUS" = "200" ]; then
                break
              fi
              sleep 1
            done

            echo "Admin status: $ADMIN_STATUS"

            if [ "$ADMIN_STATUS" != "200" ]; then
              echo "ERROR: Admin portal failed"
              exit 1
            fi

            echo "===================================="
            echo "19. DEPLOYMENT SUMMARY"
            echo "===================================="

            docker compose ps

            echo "Main: https://polandexim.com/"
            echo "APK: https://polandexim.com/download"
            echo "Admin: https://admin.polandexim.com/"

            echo "Deployment checks completed"
