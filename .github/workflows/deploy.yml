name: Deploy Gaming Platform

on:
  push:
    branches:
      - client-version

jobs:
  # Static gate in front of the deploy. A missing import only fails at request
  # time in Python, so an admin page that 500s on every search shipped to the VPS
  # unnoticed; F821 catches exactly that in seconds, and `tsc -b` does the same
  # for the frontend. Both are kept narrow on purpose so they fail only on real
  # breakage, never on style.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Backend — undefined names
        run: ruff check --select F821,F822 backend/app backend/tests

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend — type check
        working-directory: frontend
        run: npx tsc -b

  # Full backend suite. Left non-blocking until it has proven itself green on a
  # few runs — remove `continue-on-error` and add `backend-tests` to the deploy
  # job's `needs` to make it a real gate.
  backend-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gaming_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gaming_test_db
      AUTO_MIGRATE: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/integration tests/unit -q

  deploy:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e

            echo "=== 1. NAVIGATING TO REPO ==="
            cd /root/gaming-platform || cd ~/gaming-platform

            echo "=== 2. PULLING LATEST CODE ==="
            git fetch origin client-version
            git reset --hard origin/client-version

            echo "=== CURRENT COMMIT ==="
            git log -1 --oneline

            echo "=== 3. STARTING BACKEND & DB SERVICES ==="
            docker compose up -d --build backend db redis

            echo "=== 4. BUILDING FRONTEND ==="
            docker compose run --rm frontend npm run build

            echo "=== 5. DEPLOYING TO NGINX WEB ROOT ==="
            sudo cp -r frontend/dist/* /opt/gaming-platform/frontend/dist/
            if [ -f frontend/public/Corona888.apk ]; then
              sudo cp frontend/public/Corona888.apk /opt/gaming-platform/frontend/dist/Corona888.apk
              sudo chmod 644 /opt/gaming-platform/frontend/dist/Corona888.apk
            fi
            sudo chown -R www-data:www-data /opt/gaming-platform/frontend/dist
            sudo chmod -R 755 /opt/gaming-platform/frontend/dist

            echo "=== 6. RELOADING NGINX ==="
            sudo systemctl reload nginx

            echo "=== 7. VERIFYING STATUS ==="
            docker compose ps
            curl -sf http://127.0.0.1:8000/api/v1/health || true
            curl -I http://127.0.0.1 || true

            echo "=== DEPLOYMENT COMPLETED SUCCESSFULLY ==="
