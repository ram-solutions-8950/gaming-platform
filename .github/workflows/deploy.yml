name: Deploy Gaming Platform

on:
  push:
    branches:
      - client-version

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/gaming-platform

            echo "Pulling latest code..."
            git fetch origin client-version
            git reset --hard origin/client-version

            echo "Rebuilding containers..."
            docker compose up -d --build

            echo "Checking containers..."
            docker compose ps

            echo "Waiting for backend to become ready..."

            BACKEND_READY=false

            for i in $(seq 1 30); do
              echo "Backend health check attempt $i/30..."

              if curl -fsS --max-time 5 http://localhost:8000/api/v1/health; then
                echo ""
                echo "Backend is ready."
                BACKEND_READY=true
                break
              fi

              echo "Backend not ready yet. Waiting 2 seconds..."
              sleep 2
            done

            if [ "$BACKEND_READY" != "true" ]; then
              echo "Backend failed to become ready."
              echo "Backend logs:"
              docker compose logs --tail=100 backend
              exit 1
            fi

            echo "Checking frontend..."

            FRONTEND_READY=false

            for i in $(seq 1 30); do
              echo "Frontend health check attempt $i/30..."

              if curl -fsS --max-time 5 http://localhost:5173 > /dev/null; then
                echo "Frontend is ready."
                FRONTEND_READY=true
                break
              fi

              echo "Frontend not ready yet. Waiting 2 seconds..."
              sleep 2
            done

            if [ "$FRONTEND_READY" != "true" ]; then
              echo "Frontend failed to become ready."
              echo "Frontend logs:"
              docker compose logs --tail=100 frontend
              exit 1
            fi

            echo "Final container status:"
            docker compose ps

            echo "Deployment successful."