name: Deploy Gaming Platform

on:
  push:
    branches:
      - client-version

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e

            echo "=== 1. NAVIGATING TO REPO ==="
            cd /root/gaming-platform || cd ~/gaming-platform

            echo "=== 2. PULLING LATEST CODE ==="
            git fetch origin client-version
            git reset --hard origin/client-version

            echo "=== CURRENT COMMIT ==="
            git log -1 --oneline

            echo "=== 3. STARTING BACKEND & DB SERVICES ==="
            docker compose up -d --build backend db redis

            echo "=== 4. BUILDING FRONTEND ==="
            docker compose run --rm frontend npm run build

            echo "=== 5. DEPLOYING TO NGINX WEB ROOT ==="
            sudo cp -r frontend/dist/* /opt/gaming-platform/frontend/dist/
            if [ -f frontend/public/Corona888.apk ]; then
              sudo cp frontend/public/Corona888.apk /opt/gaming-platform/frontend/dist/Corona888.apk
              sudo chmod 644 /opt/gaming-platform/frontend/dist/Corona888.apk
            fi
            sudo chown -R www-data:www-data /opt/gaming-platform/frontend/dist
            sudo chmod -R 755 /opt/gaming-platform/frontend/dist

            echo "=== 6. RELOADING NGINX ==="
            sudo systemctl reload nginx

            echo "=== 7. VERIFYING STATUS ==="
            docker compose ps
            curl -sf http://127.0.0.1:8000/api/v1/health || true
            curl -I http://127.0.0.1 || true

            echo "=== DEPLOYMENT COMPLETED SUCCESSFULLY ==="
