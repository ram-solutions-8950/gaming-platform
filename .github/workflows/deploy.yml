name: Deploy Gaming Platform

on:
  push:
    branches:
      - client-version

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/gaming-platform

            echo "Pulling latest code..."
            git fetch origin client-version
            git reset --hard origin/client-version

            echo "Rebuilding containers..."
            docker compose up -d --build

            echo "Checking containers..."
            docker compose ps

            echo "Waiting for backend..."

            for i in {1..12}; do
              if curl -fsS http://localhost:8000/api/v1/health; then
                echo "Backend is healthy."
                break
              fi

              if [ "$i" -eq 12 ]; then
                echo "Backend failed health check."
                docker compose logs --tail=100 backend
                exit 1
              fi

              echo "Backend not ready yet... attempt $i/12"
              sleep 5
            done

            echo "Checking frontend..."
            curl -f http://localhost:5173

            echo "Deployment successful."