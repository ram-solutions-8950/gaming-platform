# --- 1. Admin Portal: admin.corona888.tech ---
server {
    listen 80;
    server_name admin.corona888.tech;
    root /opt/gaming-platform/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- 2. Player Portal & Downloads: corona888.tech ---
server {
    listen 80;
    server_name corona888.tech www.corona888.tech;
    root /opt/gaming-platform/frontend/dist;
    index index.html;

    # Serve APK files with proper download headers
    location ~* \.apk$ {
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition 'attachment; filename="Corona888.apk"';
        add_header Cache-Control "no-cache";
    }

    # Redirect /admin path on main site to admin subdomain
    location ^~ /admin {
        return 301 https://admin.corona888.tech$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Proxy
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
