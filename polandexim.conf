# ============================================================
# 1. ADMIN PANEL
# https://admin.polandexim.com/
# ============================================================

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name admin.polandexim.com;

    ssl_certificate /etc/nginx/ssl/corona888.tech.pem;
    ssl_certificate_key /etc/nginx/ssl/corona888.tech.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /opt/gaming-platform/frontend/dist;
    index index.html;

    # Admin frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Uploaded media assets (QR codes, avatars)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# ============================================================
# 2. MAIN WEBSITE
# https://polandexim.com/
#
# /              → Main website (Next.js Payment Portal)
# /download      → APK download
# /api/          → Backend API
# /ws/           → WebSocket
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name polandexim.com www.polandexim.com;

    ssl_certificate /etc/nginx/ssl/corona888.tech.pem;
    ssl_certificate_key /etc/nginx/ssl/corona888.tech.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /opt/gaming-platform/frontend/dist;
    index index.html;


    # --------------------------------------------------------
    # APK DOWNLOAD LANDING PAGE
    # https://polandexim.com/download
    # https://polandexim.com/download-apk
    # --------------------------------------------------------

    location ^~ /download {
        root /opt/gaming-platform/frontend/dist;
        try_files /index.html =404;
    }

    location ^~ /download-apk {
        root /opt/gaming-platform/frontend/dist;
        try_files /index.html =404;
    }


    # --------------------------------------------------------
    # FRONTEND ASSETS (Vite bundles for Download page & Admin)
    # https://polandexim.com/assets/...
    # --------------------------------------------------------

    location /assets/ {
        root /opt/gaming-platform/frontend/dist;
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location = /favicon.svg {
        root /opt/gaming-platform/frontend/dist;
        try_files $uri =404;
    }

    # Cashfree returns wallet deposits here. Serve the player SPA instead of
    # sending this route to the Next.js payment portal (which has no /wallet page).
    location = /wallet {
        root /opt/gaming-platform/frontend/dist;
        try_files /index.html =404;
    }


    # --------------------------------------------------------
    # APK FILE DIRECT DOWNLOAD
    # https://polandexim.com/Corona888.apk
    # --------------------------------------------------------

    location ~* \.apk$ {
        root /opt/gaming-platform/frontend/dist;
        try_files /Corona888.apk =404;

        types {
            application/vnd.android.package-archive apk;
        }

        add_header Content-Disposition 'attachment; filename="Corona888.apk"';
        add_header Cache-Control "no-cache";
    }


    # --------------------------------------------------------
    # MAIN WEBSITE (Next.js Payment Portal)
    # https://polandexim.com/
    # --------------------------------------------------------

    location / {
        proxy_pass http://127.0.0.1:3005;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # --------------------------------------------------------
    # NEXT.JS PAYMENT CASHFREE API
    # https://polandexim.com/api/cashfree/...
    # --------------------------------------------------------

    location /api/cashfree/ {
        proxy_pass http://127.0.0.1:3005;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # --------------------------------------------------------
    # MEDIA UPLOADS (QR codes, avatars)
    # https://polandexim.com/uploads/...
    # --------------------------------------------------------

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # --------------------------------------------------------
    # BACKEND API
    # https://polandexim.com/api/...
    # --------------------------------------------------------

    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # --------------------------------------------------------
    # WEBSOCKET
    # https://polandexim.com/ws/...
    # --------------------------------------------------------

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# ============================================================
# 3. LEGACY DOMAIN REDIRECT
# ============================================================

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name corona888.tech www.corona888.tech admin.corona888.tech;

    ssl_certificate /etc/nginx/ssl/corona888.tech.pem;
    ssl_certificate_key /etc/nginx/ssl/corona888.tech.key;

    return 301 https://polandexim.com$request_uri;
}
